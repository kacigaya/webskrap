[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "webskrap"
version = "0.10.1"
description = "A Playwright-based Python scraping framework with coherent browser profiles and session controls."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "kacigaya" }
]
keywords = ["browser-automation", "playwright", "scraping", "crawler"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=1.2,<2",
  "patchright>=1.60.0",
  "playwright>=1.49",
  "pydantic>=2.8",
  "rich>=13.9",
  "typer>=0.15",
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.8",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[project.scripts]
webskrap = "webskrap.cli:app"
webskrap-mcp = "webskrap.mcp_server:main"

[project.urls]
Homepage = "https://github.com/kacigaya/webskrap"
Repository = "https://github.com/kacigaya/webskrap"
Issues = "https://github.com/kacigaya/webskrap/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/webskrap"]

[tool.hatch.build.targets.sdist]
# The web/ frontend ships only to GitHub Pages, never to PyPI. assets/ holds
# the README logo, which no install step reads.
exclude = ["web", ".github", "assets"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "browser: requires installed Playwright browsers",
  "live: hits public third-party bot-detection demos (opt-in via WEBSKRAP_LIVE=1)",
]

# Coverage is measured in several CI jobs (one per Python version, plus the
# browser job) and combined into a single gate. `parallel` keeps each run in
# its own data file, and `relative_files` lets those files combine across jobs
# and interpreters that unpack the checkout at different absolute paths.
[tool.coverage.run]
source = ["webskrap"]
parallel = true
relative_files = true
branch = true

[tool.coverage.paths]
# Map an installed copy back onto the source tree so combined data lands on one
# set of files instead of counting the same line twice.
source = ["src/webskrap", "*/site-packages/webskrap", "*\\site-packages\\webskrap"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "D"]
# D203/D213 are the only ignores: they contradict the google convention's own
# D211/D212. Every other docstring rule is on, including D105 (magic methods)
# and D107 (__init__), because the affected symbols carry behavior a caller
# cannot infer from the class docstring: lazy driver start, context ownership,
# and what leaving an `async with` block releases.
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# S101 (assert) is what tests are written in; S105/S106 flag the dummy proxy
# credentials in fixtures; S108 flags the /tmp paths that path-rejection tests
# feed in on purpose; D1 docstring rules do not apply to test bodies.
"tests/**" = ["S101", "S105", "S106", "S108", "D1"]
"benchmarks.py" = ["S101", "D1"]
"scripts/**" = ["S101", "D1"]

[tool.ruff.format]
quote-style = "double"

# Bandit runs alongside Ruff's S rules: same origin, different engine, and it
# reads the `# nosec <id>` markers Ruff ignores. Nothing is skipped globally --
# every finding is suppressed at its own line with a reason, so a new unsafe
# call of the same kind elsewhere still fails the run. Needs `bandit[toml]`.
[tool.bandit]
exclude_dirs = ["tests", "scripts", "web", ".venv"]

[tool.pyright]
include = ["src/webskrap"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
