[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "webskrap"
version = "0.10.1"
description = "A Playwright-based Python scraping framework with coherent browser profiles and session controls."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "kacigaya" }
]
keywords = ["browser-automation", "playwright", "scraping", "crawler"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=1.2,<2",
  "patchright>=1.60.0",
  "playwright>=1.49",
  "pydantic>=2.8",
  "rich>=13.9",
  "typer>=0.15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[project.scripts]
webskrap = "webskrap.cli:app"
webskrap-mcp = "webskrap.mcp_server:main"

[project.urls]
Homepage = "https://github.com/kacigaya/webskrap"
Repository = "https://github.com/kacigaya/webskrap"
Issues = "https://github.com/kacigaya/webskrap/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/webskrap"]

[tool.hatch.build.targets.sdist]
# The web/ frontend ships only to GitHub Pages, never to PyPI. assets/ holds
# the README logo, which no install step reads.
exclude = ["web", ".github", "assets"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "browser: requires installed Playwright browsers",
  "live: hits public third-party bot-detection demos (opt-in via WEBSKRAP_LIVE=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "D"]
# D203/D213 contradict the google convention's own D211/D212. D107 (__init__)
# and D105 (magic methods) are covered by the owning class's docstring, which
# is where the constructor arguments and context-manager behavior are described.
ignore = ["D203", "D213", "D107", "D105"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# S311: the humanized cursor path randomizes pixel offsets and pauses. It is
# timing jitter, never a secret, so a CSPRNG would only cost entropy.
"src/webskrap/client.py" = ["S311"]
# S101 (assert) is what tests are written in; S105/S106 flag the dummy proxy
# credentials in fixtures; S108 flags the /tmp paths that path-rejection tests
# feed in on purpose; D1 docstring rules do not apply to test bodies.
"tests/**" = ["S101", "S105", "S106", "S108", "D1"]
"benchmarks.py" = ["S101", "D1"]
"scripts/**" = ["S101", "D1"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src/webskrap"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
