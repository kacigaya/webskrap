<!DOCTYPE html>
<!-- Cloudflare's own "Access denied" error page (error 1020), cut down. -->
<html lang="en-US"><head><title>Access denied | www.example.test used Cloudflare to restrict access</title></head>
<body>
<div id="cf-wrapper">
  <div id="cf-error-details" class="p-0">
    <header>
      <h1><span data-translate="error">Error</span><span>1020</span></h1>
      <h2>Access denied</h2>
    </header>
    <section>
      <p>This website is using a security service to protect itself from online attacks.</p>
    </section>
    <div class="cf-error-footer">
      <p>Cloudflare Ray ID: <strong>0123456789abcdef</strong> &bull; Your IP: 192.0.2.1</p>
    </div>
  </div>
</div>
</body></html>
