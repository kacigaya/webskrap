<!DOCTYPE html><html lang="en"><head>
    <link rel="canonical" href="https://duckduckgo.com/">
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <title>
        DuckDuckGo
    </title>
</head>
<body>
    <a name="top"></a>
    <center id="lite_wrapper">
        <br>
        <a class="header-url" href="/html/"><span class="header">DuckDuckGo</span></a>
        <br><br>
        <iframe name="ifr" width="0" height="0" border="0" class="hidden"></iframe>
        <form id="img-form" action="//duckduckgo.com/anomaly.js" target="ifr" method="POST"></form>
        <form id="challenge-form" action="//duckduckgo.com/anomaly.js" method="POST">
            <div class="anomaly-modal__mask">
                <div class="anomaly-modal__modal  is-ie" data-testid="anomaly-modal">
                    <div class="anomaly-modal__title">Unfortunately, bots use DuckDuckGo too.</div>
                    <div class="anomaly-modal__description">Please complete the following challenge to confirm this search was made by a human.</div>
                    <div class="anomaly-modal__instructions">Select all squares containing a duck:</div>
                    <div class="anomaly-modal__puzzle-margins">
                        <div class="anomaly-modal__puzzle">
                            <div class="anomaly-modal__box" data-index="0">
                                <label class="" for="image-check_0" data-testid="anomaly-modal-tile-0">
                                    <input type="checkbox" class="anomaly-modal__check" name="image-check_0" id="image-check_0">
                                    <img class="anomaly-modal__image" alt=" " id="image-0" src="../assets/anomaly/images/challenge/0.jpg">
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="anomaly-modal__controls">
                        <button name="challenge-submit" class="btn btn--primary anomaly-modal__submit js-anomaly-modal-submit" form="challenge-form" value="redacted">Submit</button>
                    </div>
                </div>
            </div>
        </form>
    </center>
</body></html>
