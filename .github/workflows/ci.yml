name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Static analysis and packaging do not vary by interpreter, so they run once.
  checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # Pinned exactly: setup-uv publishes no floating v9 major tag.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Lint
        run: uv run --extra dev ruff check .
      - name: Format
        run: uv run --extra dev ruff format --check .
      - name: Type check
        run: uvx --from pyright==1.1.411 pyright --pythonpath .venv/bin/python src/webskrap
      # Platform branches (msvcrt, ctypes.WinDLL) are only checked when pyright
      # targets that platform, so check the other two as well.
      - name: Type check (Windows, macOS)
        run: |
          uvx --from pyright==1.1.411 pyright --pythonplatform Windows --pythonpath .venv/bin/python src/webskrap
          uvx --from pyright==1.1.411 pyright --pythonplatform Darwin --pythonpath .venv/bin/python src/webskrap
      - name: Security scan
        # Ruff's S rules already run above. Bandit is a second, independent
        # implementation and reads the `# nosec` markers Ruff ignores.
        run: uv run --extra dev bandit -c pyproject.toml -q -r src/
      - name: Audit dependencies
        run: uv run --extra dev --with pip-audit==2.9.0 pip-audit --skip-editable
      - name: Prepare package output
        run: echo "PACKAGE_DIR=$(mktemp -d .package-dist.XXXXXX)" >> "$GITHUB_ENV"
      - name: Build
        run: uv build --out-dir "$PACKAGE_DIR"
      - name: Check package metadata
        run: uv run --with twine twine check "$PACKAGE_DIR"/*

  # Requirement 1: the package works on every advertised Python version and
  # operating system. Linux runs every version; Windows and macOS run one,
  # because their failures come from the OS, not the interpreter.
  # Browsers are not installed here; the browser job below covers those paths.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # Keep third-party live tests opt-in; local browser tests run below.
      - name: Test
        env:
          COVERAGE_FILE: .coverage.unit.${{ matrix.python-version }}
        run: uv run --extra dev pytest -q -m "not browser and not live" --cov
      # The coverage gate reads Linux runs only, so the bar stays comparable.
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-${{ matrix.python-version }}
          path: .coverage.unit.*
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # Browser tests need a Chrome for Testing download, so they run on one interpreter.
  # Every OS runs them: process control and profile locks differ per platform.
  browser:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.13"
      # Runner images ship Chrome, so its system libraries are already there.
      - name: Install Chrome for Testing
        run: uv run webskrap install
      - name: Test
        env:
          COVERAGE_FILE: .coverage.browser
        run: uv run --extra dev pytest -q -m "browser and not live" --cov
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-browser
          path: .coverage.browser
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # Requirement 2: the whole library stays above the coverage bar. This is the
  # canonical gate. It needs every test job, so a failed or skipped test job
  # fails this one too and the bar cannot be met by a partial run.
  coverage:
    needs: [test, browser]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine coverage from every test job
        # Fails if a data file is missing or unreadable, so a job that silently
        # produced nothing cannot be combined away.
        run: |
          uv run --extra dev coverage combine
          uv run --extra dev coverage report
      - name: Enforce coverage threshold
        run: uv run --extra dev coverage report --fail-under=85
